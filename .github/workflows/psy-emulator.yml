# SPDX-License-Identifier: GPL-3.0-only
# (PSY) the browser emulator built from the current source (not the pinned web/EMULATOR commit) and published to
# GitHub Pages: https://<user>.github.io/<repo>/ . One-time setup: Settings > Pages > Source: GitHub Actions.
name: psy-emulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: psy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1
      - name: generated headers (fonts, icons, palettes, shapes, tables, samples)
        run: python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11
      - name: the emulator
        run: |
          if ! sh web/emu/build.sh > /tmp/emu.log 2>&1; then
            # (the log is private to a signed-in viewer: the first lines of it as annotations anyone can read)
            grep -n -E "error|Error|undefined|not found|fatal" /tmp/emu.log | head -8 | while IFS= read -r l; do echo "::error::$(printf '%s' "$l" | cut -c1-400)"; done
            tail -n 6 /tmp/emu.log | while IFS= read -r l; do echo "::warning::$(printf '%s' "$l" | cut -c1-400)"; done
            exit 1
          fi
          tail -n 2 /tmp/emu.log
          # (the PSY page: web/emu/index.html, with the version filled in)
          VERSION=$(sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' firmware/src/felucca.c)
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@PREVIEW@//g" web/emu/index.html > build/emu/index.html
      - name: the screens (tests/ui_render.c, every screen in every palette) and the UI test
        continue-on-error: true
        run: |
          FV=$(sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' firmware/src/felucca.c)
          mkdir -p build/host build/ui_new/ppm build/ui_slot
          cc -O1 -w "-DFELUCCA_VERSION=\"$FV\"" -Ibuild/gen -Ifirmware/src -Itests -o build/host/ui_render tests/ui_render.c -lm
          build/host/ui_render build/ui_new build/ui_slot > build/ui_new/run.txt 2>&1 || echo "ui_render exit $?" >> build/ui_new/run.txt
          python3 tests/ui_render.py build/ui_new build/ui_slot >> build/ui_new/run.txt 2>&1 || true
          cc -O1 -w -Ibuild/gen -Ifirmware/src -o build/host/ui_test tests/ui_test.c -lm && (build/host/ui_test > build/ui_new/ui_test.txt 2>&1; echo "exit $?" >> build/ui_new/ui_test.txt) || echo "ui_test did not build" > build/ui_new/ui_test.txt
      - name: the site
        run: |
          mkdir -p build/pages
          cp -r build/emu/. build/pages/
          if [ -d build/ui_new ]; then
            mkdir -p build/pages/shots
            cp build/ui_new/*.png build/ui_new/*.txt build/pages/shots/ 2>/dev/null || true
            for d in build/ui_new/*/; do n=$(basename "$d"); [ "$n" = ppm ] || cp -r "$d" build/pages/shots/; done
            (cd build/pages/shots && find . -name '*.png' | sort > index.txt)
          fi
          touch build/pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
